name: Deploy PR
on:
    pull_request:
        types: [opened, reopened]
    workflow_dispatch:
        inputs:
            target:
                required: true
                type: string
                description: 'Deployment target (e.g., alli1234)'
            npm-ci-flags:
                type: string
                required: false
                default: '--omit=dev'
                description: allow overriding the ci flags
    issue_comment:
        types: [created]

jobs:
    react:
        if: |
            github.event_name == 'pull_request' ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request != null &&
             contains(toLower(github.event.comment.body), 'deploy pr'))
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: React to PR open
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.reactions.createForIssue({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        content: 'rocket',
                      });

            - name: React to comment
              if: github.event_name == 'issue_comment'
              uses: actions/github-script@v7
              with:
                  script: |
                      await github.rest.reactions.createForIssueComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: context.payload.comment.id,
                        content: 'rocket',
                      });

    deploy:
        needs: react
        if: |
            github.event_name == 'pull_request' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.pull_request != null &&
             contains(toLower(github.event.comment.body), 'deploy pr'))
        runs-on: ubuntu-latest
        steps:
            - name: Fake deploy
              run: |
                  echo "Would deploy package: ${{ vars.FRONTEND_PACKAGE_NAME }}"
                  echo "Target: ${{ inputs.target || 'none' }}"
                  echo "Triggered by: ${{ github.event_name }}"
